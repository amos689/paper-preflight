name: Release

# Publishing a GitHub Release tagged vX.Y.Z builds the package and uploads it to PyPI through
# trusted publishing (no token in the repository; PyPI attaches PEP 740 attestations).
# One-time setup on PyPI and the release steps: docs/releasing.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/paper_preflight/__init__.py)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match the package version $version"
            exit 1
          fi
      - run: uv build
      - name: Smoke-test the wheel
        shell: bash
        run: |
          uvx --from "$(ls dist/*.whl)" paper-preflight --version
          uvx --from "$(ls dist/*.whl)" paper-preflight check examples/demo-paper --offline \
            --fail-on never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paper-preflight
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The MCP Registry entry (server.json) points at the PyPI package, so it is published after it.
  # GitHub's OIDC token proves the io.github.amos689/ namespace: no secret, no device code.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher (pinned, checksum verified)
        shell: bash
        run: |
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
      - name: Wait until PyPI serves this version
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/paper_preflight/__init__.py)
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/paper-preflight/$version/json" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::paper-preflight $version is not on PyPI after five minutes"
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
