# Each case is one reference from an evaluation and the warning and error rules it must produce
# now. "fp-" cases were false positives once (the note says which); "team-" cases a regression;
# "real-" cases are real problems, so that fixing false positives does not hide them. Adding a
# case: append it here, then `uv run python evals/museum.py record`.

